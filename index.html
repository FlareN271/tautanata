<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tautanata</title>
<meta name="description" content="Menata tautan yang berserakan — setiap link adalah satu simpul.">
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Layar hubungkan (pertama kali) ===== -->
<section id="connect" class="connect" hidden>
  <div class="connect-card">
    <img src="icons/icon-192.png" alt="" class="connect-logo">
    <h1>Tautanata</h1>
    <p class="muted">Menata tautan yang berserakan.<br>Hubungkan ke Google Sheet-mu sekali saja di perangkat ini.</p>
    <label>URL server (Apps Script, berakhiran <code>/exec</code>)
      <input id="cUrl" class="field" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label>Token rahasia
      <input id="cToken" class="field" type="password" placeholder="Token dari log setup()" autocomplete="off"></label>
    <button id="cBtn" class="btn primary wide">Hubungkan</button>
    <p id="cErr" class="err"></p>
  </div>
</section>

<!-- ===== Aplikasi ===== -->
<div id="app" class="app" hidden>
  <aside id="side" class="side">
    <div class="side-head">
      <img src="icons/icon-192.png" alt="" class="side-logo">
      <div><div class="side-name">Tautanata</div><div class="side-sub" id="sideCount"></div></div>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot">
      <button id="settingsBtn" class="nav-item"><span class="ic" data-i="gear"></span><span class="nav-label">Pengaturan</span></button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main class="main">
    <header class="bar">
      <div class="bar-row">
        <button id="menuBtn" class="icon-btn only-mobile" aria-label="Menu"><span class="ic" data-i="menu"></span></button>
        <h1 id="viewTitle" class="view-title">Semua tautan</h1>
        <div class="bar-actions">
          <button id="syncBtn" class="icon-btn" title="Sinkron"><span class="ic" data-i="sync"></span></button>
          <button id="addBtn" class="btn primary"><span class="ic" data-i="plus"></span><span class="hide-xs">Tambah</span></button>
        </div>
      </div>
      <div class="bar-row tools">
        <div class="search">
          <span class="ic" data-i="search"></span>
          <input id="q" type="search" placeholder="Cari judul, tag, catatan…" autocomplete="off" enterkeyhint="search">
          <kbd class="hide-xs">/</kbd>
        </div>
        <select id="sort" class="select" aria-label="Urutkan">
          <option value="baru">Terbaru</option>
          <option value="lama">Terlama</option>
          <option value="judul">Judul A–Z</option>
          <option value="domain">Situs</option>
        </select>
        <div class="seg" role="group" aria-label="Tampilan">
          <button data-view="list" class="seg-btn" title="Daftar"><span class="ic" data-i="list"></span></button>
          <button data-view="grid" class="seg-btn" title="Kartu"><span class="ic" data-i="grid"></span></button>
        </div>
      </div>
    </header>

    <div id="notice" class="notice" hidden></div>
    <section id="list" class="list"></section>
    <div id="empty" class="empty" hidden></div>
    <button id="moreBtn" class="btn more" hidden>Tampilkan lebih banyak</button>
  </main>
</div>

<!-- ===== Dialog tambah / ubah ===== -->
<dialog id="dlg" class="dlg">
  <form id="form" method="dialog">
    <div class="dlg-head">
      <h2 id="dlgTitle">Tambah tautan</h2>
      <button type="button" class="icon-btn" data-close aria-label="Tutup"><span class="ic" data-i="x"></span></button>
    </div>
    <label>URL
      <span class="row"><input id="fUrl" class="field" type="url" inputmode="url" placeholder="https://…" required>
      <button type="button" id="pasteBtn" class="btn">Tempel</button></span></label>
    <label>Judul <input id="fJudul" class="field" placeholder="Kosongkan → diambil otomatis"></label>
    <div class="grid2">
      <label>Koleksi <input id="fKoleksi" class="field" list="koleksiList" placeholder="Otomatis"></label>
      <label>Tag <input id="fTags" class="field" placeholder="pisahkan dengan koma"></label>
    </div>
    <datalist id="koleksiList"></datalist>
    <p class="hint" id="fHint"></p>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="fFav"><span><span class="ic" data-i="star"></span>Favorit</span></label>
      <label class="toggle"><input type="checkbox" id="fLater"><span><span class="ic" data-i="later"></span>Baca nanti</span></label>
    </div>
    <label>Catatan <textarea id="fCatatan" class="field" rows="3" placeholder="Kenapa link ini disimpan?"></textarea></label>
    <details class="more-fields"><summary>Deskripsi & gambar</summary>
      <label>Deskripsi <textarea id="fDesk" class="field" rows="2" placeholder="Opsional — diambil otomatis bila kosong"></textarea></label>
      <label>URL gambar sampul <input id="fGambar" class="field" inputmode="url" placeholder="Opsional — diambil otomatis bila kosong"></label>
    </details>
    <div class="dlg-actions">
      <button type="button" id="delBtn" class="btn danger" hidden>Hapus</button>
      <span class="grow"></span>
      <button type="button" class="btn" data-close>Batal</button>
      <button type="submit" id="saveBtn" class="btn primary">Simpan</button>
    </div>
  </form>
</dialog>

<!-- ===== Dialog pengaturan ===== -->
<dialog id="setDlg" class="dlg">
  <div class="dlg-body">
    <div class="dlg-head">
      <h2>Pengaturan</h2>
      <button type="button" class="icon-btn" data-close aria-label="Tutup"><span class="ic" data-i="x"></span></button>
    </div>
    <label>URL server <input id="sUrl" class="field" inputmode="url" autocomplete="off"></label>
    <label>Token <input id="sToken" class="field" type="password" autocomplete="off"></label>
    <div class="row"><button id="sSave" class="btn primary">Simpan & tes</button><span id="sStatus" class="small muted"></span></div>
    <hr>
    <h3>Perawatan</h3>
    <div class="stack">
      <button id="sRetag" class="btn">Terapkan ulang aturan auto-tag</button>
      <button id="sImg" class="btn">Lengkapi gambar sampul</button>
      <a id="sSheet" class="btn" target="_blank" rel="noopener" hidden>Buka Google Sheet (aturan & data)</a>
      <span id="sMaint" class="small muted"></span>
    </div>
    <hr>
    <h3>Ekspor</h3>
    <div class="row"><button id="sCsv" class="btn">Unduh CSV</button><button id="sJson" class="btn">Unduh JSON</button></div>
    <hr>
    <div class="row"><button id="sLogout" class="btn danger">Putuskan perangkat ini</button><span class="grow"></span><span class="small muted" id="sVer"></span></div>
  </div>
</dialog>

<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
